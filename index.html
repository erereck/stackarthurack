<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#14131b" />
  <title>Stack Arthur Attack</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" aria-label="Stack Arthur Attack">
    <section id="hud" aria-live="polite">
      <div class="hudBox"><small>PTS</small><strong id="score">0</strong></div>
      <div class="hudBox"><small>LINHAS</small><strong id="lines">0</strong></div>
      <div class="hudBox"><small>GUINDASTES</small><strong id="craneCount">1</strong></div>
      <div class="hudBox"><small>REC</small><strong id="best">0</strong></div>
    </section>

    <button id="pause" class="roundBtn" type="button" aria-label="Pausar">Ⅱ</button>
    <div id="toast" aria-live="polite"></div>

    <section id="stageWrap">
      <canvas id="game" width="660" height="760" aria-label="Área de jogo"></canvas>
    </section>

    <section id="controls" aria-label="Controles">
      <div class="pad">
        <button class="gameBtn" data-key="left" type="button" aria-label="Mover para esquerda">◀</button>
        <button class="gameBtn" data-key="right" type="button" aria-label="Mover para direita">▶</button>
      </div>
      <button class="gameBtn jump" data-key="jump" type="button" aria-label="Pular"><span class="arrow">▲</span><span class="tiny">PULAR</span></button>
    </section>

    <section id="overlay">
      <div class="card">
        <p class="eyebrow">remake não-oficial feito pro Arthur</p>
        <h1>STACK <span>ARTHUR</span><br />ATTACK</h1>
        <p id="overlayText">Agora o guindaste realmente atravessa o trilho, escolhe uma coluna e solta a caixa. Feche linhas, faça 3 iguais e sobreviva.</p>
        <div class="chars" id="chars"></div>
        <p class="desc" id="charDesc"></p>
        <button class="start" id="start" type="button">JOGAR</button>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
